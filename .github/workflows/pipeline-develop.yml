name: Pipeline Develop

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            tests/tests.csproj
            U-VoluntApp_Backend.csproj

      - name: Restore tests
        run: dotnet restore tests/tests.csproj

      - name: Build tests
        run: dotnet build tests/tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Validate Docker compose
        run: docker compose config

  cd:
    needs: ci
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:develop
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:develop-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
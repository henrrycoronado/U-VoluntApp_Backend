name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore U-VoluntApp_Backend.csproj

      - name: Build
        run: dotnet build U-VoluntApp_Backend.csproj --configuration Release --no-restore

      - name: Validate Docker compose
        run: docker compose config
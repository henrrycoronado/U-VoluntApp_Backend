name: Pipeline Master (CI/CD)

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore and Build
        run: dotnet build U-VoluntApp_Backend.csproj --configuration Release

      - name: Run Tests
        run: dotnet test tests/tests.csproj --configuration Release

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:latest
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:${{ github.sha }}

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s (Secret Injection & Rollout)
        run: |
          # 1. Crear/Actualizar secretos directamente en el clúster sin archivos intermedios
          # kubectl create secret generic postgres-secrets \
          #  --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
          #  --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
          #  --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
          #  --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic backend-secrets \
            --from-literal=DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=S3_ENDPOINT_URL="${{ secrets.S3_ENDPOINT_URL }}" \
            --from-literal=STORAGE_PUBLIC_BASE_URL="${{ secrets.STORAGE_PUBLIC_BASE_URL }}" \
            --from-literal=STORAGE_DEFAULTS_BUCKET="${{ secrets.STORAGE_DEFAULTS_BUCKET }}" \
            --from-literal=STORAGE_UPLOAD_BUCKET="${{ secrets.STORAGE_UPLOAD_BUCKET }}" \
            --from-literal=SUPERUSER_EMAIL="${{ secrets.SUPERUSER_EMAIL }}" \
            --from-literal=SUPERUSER_PASSWORD="${{ secrets.SUPERUSER_PASSWORD }}" \
            --from-literal=SHOW_SWAGGER="${{ secrets.SHOW_SWAGGER }}" \
            --from-literal=SEQ_ADMIN_PASSWORD="${{ secrets.SEQ_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Aplicar manifiestos
          # kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/seq.yaml

          # 3. Forzar actualización de la imagen
          kubectl set image deployment/backend-deployment backend-api=ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:${{ github.sha }}
          kubectl rollout status deployment/backend-deployment

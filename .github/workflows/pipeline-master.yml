name: Pipeline Master (CI/CD)

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and Build
        run: dotnet build U-VoluntApp_Backend.csproj --configuration Release

      - name: Run Tests
        run: dotnet test tests/tests.csproj --configuration Release

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:latest
            ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:${{ github.sha }}

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s (Secret Injection & Rollout)
        run: |
          # 1. Crear/Actualizar secretos directamente en el clúster sin archivos intermedios
          kubectl create secret generic backend-secrets \
            --from-literal=DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=STORAGE_URL="${{ secrets.STORAGE_URL }}" \
            --from-literal=STORAGE_SERVICE_ROLE_KEY="${{ secrets.STORAGE_SERVICE_ROLE_KEY }}" \
            --from-literal=SUPERUSER_EMAIL="${{ secrets.SUPERUSER_EMAIL }}" \
            --from-literal=SUPERUSER_PASSWORD="${{ secrets.SUPERUSER_PASSWORD }}" \
            --from-literal=SHOW_SWAGGER="${{ secrets.SHOW_SWAGGER }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Aplicar manifiestos
          kubectl apply -f k8s/config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/hpa.yaml

          # 3. Forzar actualización de la imagen
          kubectl set image deployment/backend-deployment backend-api=ghcr.io/${{ github.repository_owner }}/u-voluntapp-backend:${{ github.sha }}
          kubectl rollout status deployment/backend-deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  JWT_ISSUER: "uvoluntapp-api"
  JWT_AUDIENCE: "uvoluntapp-client"
  JWT_EXPIRY_MINUTES: "60"
  ENABLE_HTTPS_REDIRECTION: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
data:
  DB_CONNECTION_STRING: "" 
  JWT_SECRET: ""
  SUPABASE_URL: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  SUPERUSER_EMAIL: ""
  SUPERUSER_PASSWORD: ""

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq-deployment
  namespace: default
  labels:
    app: seq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
      - name: seq
        image: datalust/seq:latest
        ports:
        - containerPort: 80
        - containerPort: 5341
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SEQ_STORAGE_DISABLEFREEDISKSPACECHECKING
          value: "true"
        - name: SEQ_FIRSTRUN_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SEQ_ADMIN_PASSWORD
        volumeMounts:
        - name: seq-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: seq-data
        persistentVolumeClaim:
          claimName: seq-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seq-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: seq
  ports:
  - name: ui
    port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: seq-service-ext
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: seq
  ports:
  - name: ext-ui
    port: 5341
    targetPort: 80
